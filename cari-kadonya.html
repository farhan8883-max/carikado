<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cari Kadonya!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&family=Caveat:wght@500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#fff3f6;--ink:#6b3a4e;--pink:#ff8fb1;--deep:#e0558a;--cream:#fffaf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(224,85,138,.3)}
canvas{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;z-index:2;display:flex;padding:3%;background:rgba(255,236,243,.78);backdrop-filter:blur(3px);overflow:auto}
#ov[hidden]{display:none}
.card{margin:auto;max-width:460px;width:100%;background:var(--cream);border:3px solid var(--pink);border-radius:22px;padding:clamp(14px,3vh,26px);text-align:center;box-shadow:0 10px 0 rgba(224,85,138,.25);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
h1,h2{font-family:'Pacifico',cursive;font-weight:400;color:var(--deep);margin:0 0 8px;font-size:clamp(24px,5.5vh,38px);line-height:1.2}
p{margin:0 0 12px;line-height:1.5;font-weight:500;font-size:clamp(13px,2.6vh,17px)}
.big{font-size:clamp(46px,12vh,76px);line-height:1;margin-bottom:6px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}
button{min-height:44px;padding:0 24px;border:0;border-radius:999px;background:var(--deep);color:#fff;font:700 clamp(14px,2.8vh,18px) 'Quicksand',sans-serif;cursor:pointer;box-shadow:0 4px 0 #b03c68;margin:3px}
button.alt{background:#fff;color:var(--deep);border:2px solid var(--pink);box-shadow:none}
button:focus-visible,input:focus-visible,.gb:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
#hud{position:absolute;left:0;right:0;top:0;z-index:1;display:none;justify-content:space-between;gap:8px;padding:8px 12px;pointer-events:none;font-weight:700;font-size:clamp(13px,3.2vh,19px)}
#hud span{background:rgba(255,250,240,.88);border:2px solid var(--pink);border-radius:999px;padding:3px 12px;white-space:nowrap}
#pad{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
@media (pointer:coarse){#pad.on{display:block}}
#joy{position:absolute;left:5%;bottom:10%;width:min(32vh,150px);height:min(32vh,150px);border-radius:50%;background:rgba(255,143,177,.25);border:3px solid rgba(224,85,138,.5);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(224,85,138,.7)}
#rot{display:none;position:fixed;inset:0;z-index:9;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:10px;font:700 22px 'Quicksand',sans-serif;color:var(--deep);text-align:center;padding:24px}
#rot span{font-size:60px}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}
#mb{position:absolute;right:10px;bottom:10px;z-index:4;min-height:0;width:42px;height:42px;padding:0;font-size:20px;background:#fff;border:2px solid var(--pink);box-shadow:none;border-radius:50%}
.letter{position:relative;overflow:hidden;text-align:left;background:repeating-linear-gradient(transparent 0 27px,rgba(224,85,138,.13) 27px 28px),#fffdf5;border-radius:10px;border-color:#f3c9d6;max-width:500px}
.seal{width:54px;height:54px;border-radius:50%;background:var(--deep);display:flex;align-items:center;justify-content:center;font-size:27px;margin:0 auto 4px;box-shadow:0 3px 0 #b03c68;animation:bob 1.8s ease-in-out infinite}
.ttl{text-align:center;font:400 clamp(17px,3.4vh,24px) 'Pacifico',cursive;color:var(--deep);margin-bottom:6px}
.lt{font:700 clamp(18px,3.8vh,26px)/1.45 'Caveat',cursive;white-space:pre-line;min-height:3.6em;margin:6px 0;color:#5a2e43;position:relative;z-index:1}
.cnt{text-align:center;font-size:.8em;opacity:.7;margin:4px 0}
.pol{position:relative;width:min(27vh,140px);margin:6px auto 8px;background:#fff;padding:7px 7px 6px;box-shadow:0 6px 16px rgba(120,60,90,.3);transform:rotate(-3deg);animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(2deg) translateY(-3px)}}
.ph{position:relative;height:min(31vh,165px);overflow:hidden;background:linear-gradient(135deg,#ffd6e4,#e6dcf5)}
.ph img,.nop{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.ph img{animation:kb 8s ease-in-out infinite alternate}
.nop{display:flex;align-items:center;justify-content:center;font-size:54px}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.25) translate(-5%,-4%)}}
.cap{font:700 19px 'Caveat',cursive;text-align:center;color:#8a5a70;padding-top:3px}
.tape{position:absolute;top:-9px;left:50%;width:56px;height:18px;margin-left:-28px;background:rgba(255,209,102,.7);transform:rotate(3deg);z-index:2}
i.fl2{position:absolute;bottom:-10px;font-style:normal;opacity:0;pointer-events:none;animation:up 5s linear infinite}
@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.75}100%{transform:translateY(-70vh);opacity:0}}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.ch button{margin:0;min-height:50px}
.gb{position:relative;width:140px;height:130px;margin:34px auto 18px;cursor:pointer;animation:shk 1.5s infinite}
.gb .bd{position:absolute;bottom:0;width:140px;height:92px;background:#ff8fb1;border-radius:8px}
.gb .bd::before,.gb .ld::before{content:"";position:absolute;left:58px;top:0;width:24px;height:100%;background:#ffd166}
.gb .ld{position:absolute;top:0;left:-8px;width:156px;height:42px;background:var(--deep);border-radius:8px;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
.gb .ld::before{left:66px}
.gb .ld::after{content:"🎀";position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:34px}
.gb.open{animation:none}.gb.open .ld{transform:translateY(-80px) rotate(-18deg)}
@keyframes shk{0%,40%,100%{transform:rotate(0)}10%{transform:rotate(-5deg)}20%{transform:rotate(5deg)}30%{transform:rotate(-3deg)}}
.tk{border:3px dashed var(--pink);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fff}
.tk small{letter-spacing:.15em;color:var(--deep);font-weight:700}
.tk h2{margin:2px 0}.tk .k{font:700 clamp(20px,4.2vh,28px)/1.25 'Caveat',cursive;color:#5a2e43;margin:2px 0 6px}
@media (prefers-reduced-motion:reduce){.card,.big,.seal,.pol,.ph img,i.fl2,.gb{animation:none}}

#ov{touch-action:pan-y}
.sc{max-width:500px;position:relative}
.gifts{display:flex;gap:10px;justify-content:center;margin:10px 0}
.g{margin:0;width:30%;aspect-ratio:1;min-height:0;padding:0;border-radius:20px;background:#fff;color:inherit;font-size:clamp(34px,8vh,52px);box-shadow:0 4px 0 rgba(224,85,138,.25);transition:transform .25s}
.g.open{background:#f6c445;transform:scale(1.1) rotate(-4deg)}
.cp{margin:6px 0;padding:10px 12px;border:2px dashed var(--pink);border-radius:14px;background:#fff;font-weight:700}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.hc{margin:0;min-height:clamp(64px,15vh,96px);padding:6px;border-radius:16px;background:linear-gradient(135deg,#ffa8c5,#ff7fab);color:var(--ink);font-size:clamp(12px,2.5vh,15px);box-shadow:0 3px 0 rgba(224,85,138,.3)}
.hc b{font-size:clamp(26px,6vh,38px)}.hc span{display:none}
.hc.on{background:var(--cream)}.hc.on b{display:none}.hc.on span{display:block}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-height:44vh;overflow:auto;padding:10px 6px;touch-action:pan-y}
.pg .pol{width:100%;margin:0;animation:none}.pg .ph{height:auto;aspect-ratio:3/4}
.hb{position:relative;width:min(100%,320px);aspect-ratio:1;margin:6px auto}
.th{position:absolute;width:25%;aspect-ratio:1;min-height:0;margin:0;padding:0;border:3px solid #fff;border-radius:10px;overflow:hidden;background:#ffd6e4;box-shadow:0 3px 8px rgba(120,60,90,.3)}
.th img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.nm{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font:400 clamp(22px,5vh,34px) 'Pacifico',cursive;color:#fff;text-shadow:0 2px 6px #e0558a;z-index:2;pointer-events:none}
.lb{position:absolute;inset:0;z-index:5;background:rgba(255,243,246,.96);display:flex;align-items:center;justify-content:center;border-radius:inherit;cursor:pointer}
.lb[hidden]{display:none}.lb .pol{width:min(40vh,230px)}.lb .ph{height:min(48vh,290px)}
.ck{position:relative;width:170px;height:130px;margin:30px auto 12px}
.ck .t1{position:absolute;left:25px;right:25px;top:30px;height:36px;background:#fff;border-radius:8px 8px 0 0}
.ck .t2{position:absolute;left:0;right:0;top:62px;height:46px;background:#ff8fb1;border-radius:12px}
.ck .pl{position:absolute;left:-10px;right:-10px;top:104px;height:12px;background:#fff;border-radius:50%}
.cd{position:absolute;left:0;right:0;top:4px;display:flex;justify-content:space-evenly;padding:0 30px}
.cd i{display:block;width:8px;height:28px;background:#b8a1ff;border-radius:2px;position:relative}
.cd i::before{content:"";position:absolute;left:-1px;top:-14px;width:10px;height:14px;background:radial-gradient(#fff3a0,#ffb703);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fl .4s infinite alternate}
.cd i.off::before{display:none}
@keyframes fl{to{transform:scale(1.15,.9)}}
.sx{position:relative;width:200px;height:240px;margin:8px auto;border-radius:12px;overflow:hidden;border:6px solid #fff;box-shadow:0 6px 16px rgba(120,60,90,.3)}
.sx .ph{position:absolute;inset:0;height:100%}.sx canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s;touch-action:none}
@media (prefers-reduced-motion:reduce){.cd i::before{animation:none}}

.pg{display:block;overflow:hidden;height:min(46vh,250px);max-height:none;padding:0 6px;touch-action:auto}
.pg .trk{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 0;animation:walk var(--t,16s) ease-in-out infinite alternate}
@keyframes walk{to{transform:translateY(var(--d,0px))}}
.mq{display:flex;gap:14px;height:min(46vh,250px);overflow:hidden;padding:0 6px}
.mq .col{flex:1;display:flex;flex-direction:column;gap:14px;animation:mqv 18s linear infinite}
.mq .col.rv{animation-direction:reverse}
@keyframes mqv{to{transform:translateY(calc(-50% - 7px))}}
.mq .pol{width:100%;margin:0;animation:none;flex:none}.mq .ph{height:auto;aspect-ratio:3/4}
@media (prefers-reduced-motion:reduce){.pg,.mq{overflow:auto}.pg .trk,.mq .col{animation:none}}
</style>
</head>

<div id="rot"><span>📱</span>Putar HP ke mode landscape ya</div>

 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=lg(ctx,0,0,0,VH,'#ffd6e4','#e6dcf5');ctx.fillRect(0,0,VW,VH);
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=.5;ctx.font='60px serif';[[140,90],[520,60],[820,120]].forEach(function(c){ctx.fillText('☁️',c[0]+Math.sin(time+c[0])*12,c[1])});ctx.globalAlpha=1;

function draw(dt){
 if(state==='catch'){drawCatch();return}
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.drawImage(house,0,0,VW,VH);

  items.forEach(function(it){if(it.got)return;var d=Math.hypot(it.x-P.x,it.y-P.y),a=Math.max(0,Math.min(1,1-(d-70)/90)),tw=.5+.5*Math.sin(time*4+it.x);
   ctx.save();ctx.translate(it.x,it.y);ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.globalAlpha=.35+.4*tw;ctx.font=(14+tw*6)+'px serif';ctx.fillText('✨',0,-2);

function loop(t){
 var dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;time+=dt;

// ---------- ukuran & kontrol ----------
function fit(){var vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight,k=Math.min(w/VW,h/VH);
 wrap.style.width=Math.floor(VW*k)+'px';wrap.style.height=Math.floor(VH*k)+'px'}
window.addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();
window.addEventListener('keydown',function(e){var k=e.key.toLowerCase(),tg=document.activeElement&&document.activeElement.tagName;if(tg==='INPUT')return;
 if(['arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>-1)e.preventDefault();keys[k]=true});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',function(){keys={}});
var joy=$('joy'),knob=$('knob'),jid=null;
function setDir(dx,dy){var t=.3;keys.arrowleft=dx<-t;keys.arrowright=dx>t;keys.arrowup=dy<-t;keys.arrowdown=dy>t}
function jm(e){var r=joy.getBoundingClientRect(),R=r.width/2,dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R),m=Math.hypot(dx,dy);if(m>R){dx*=R/m;dy*=R/m}knob.style.transform='translate('+dx+'px,'+dy+'px)';setDir(dx/R,dy/R)}
joy.addEventListener('pointerdown',function(e){jid=e.pointerId;joy.setPointerCapture(e.pointerId);jm(e);e.preventDefault()});
joy.addEventListener('pointermove',function(e){if(e.pointerId===jid)jm(e)});
function je(e){if(e.pointerId!==jid)return;jid=null;knob.style.transform='';setDir(0,0)}
joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
cv.addEventListener('pointermove',function(e){if(state==='catch'){var r=cv.getBoundingClientRect();cg.x=Math.max(50,Math.min(VW-50,(e.clientX-r.left)/r.width*VW))}});

menu();requestAnimationFrame(loop);
})();
